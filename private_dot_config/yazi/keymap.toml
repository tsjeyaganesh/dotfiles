[manager]
prepend_keymap = [
  # Quick navigation
  { on = ["g", "h"], run = "cd ~", desc = "Go home" },
  { on = ["g", "c"], run = "cd ~/.config", desc = "Go to .config" },
  { on = ["g", "d"], run = "cd ~/Downloads", desc = "Go to Downloads" },
  { on = ["g", "p"], run = "cd ~/projects", desc = "Go to projects" },

  # Open shell in current dir
  { on = ["<C-s>"], run = 'shell "$SHELL" --block --confirm', desc = "Open shell here" },

  # Preview vs. edit the hovered file directly, one keypress each.
  # (Enter is left at its default: it opens read-only via [open].rules
  # below, resolving text-like files to the "view" opener.)
  { on = ["<C-p>"], run = 'shell -- extpreview %h', desc = "Preview with external viewer" },
  { on = ["e"], run = 'shell --block -- ${EDITOR:-nvim} %h', desc = "Edit hovered file" },
]
