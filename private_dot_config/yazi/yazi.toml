[mgr]
show_hidden = true
sort_by = "natural"
sort_dir_first = true
linemode = "size"
ratio = [1, 4, 3]

[preview]
max_width = 1000
max_height = 1000
cache_dir = ""
image_quality = 75
tab_size = 2

[opener]
# Full edit access - only reachable directly via the "e" keybinding
# (keymap.toml), not through [open].rules below.
edit = [
  { run = '${EDITOR:-nvim} "$@"', block = true, for = "unix" },
]
# Read-only quick look, q/Esc to quit back to yazi. This is what
# Enter resolves to for text-like files via the rules below.
view = [
  { run = 'nvimview "$@"', block = true, for = "unix" },
]
open = [
  { run = 'xdg-open "$1"', desc = "Open", for = "linux" },
  { run = 'open "$@"', desc = "Open", for = "macos" },
]

[open]
rules = [
  { mime = "text/*", use = "view" },
  { mime = "image/*", use = "open" },
  { mime = "video/*", use = "open" },
  { mime = "audio/*", use = "open" },
  { mime = "application/json", use = "view" },
  { mime = "*/xml", use = "view" },
  { mime = "*", use = "open" },
]
